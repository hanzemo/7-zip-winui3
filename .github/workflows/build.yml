name: Build Signed MSIX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Generate cert
        id: cert
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\cert" | Out-Null
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=hanzemo, O=DailyFortune, C=CN" `
            -KeyUsage DigitalSignature `
            -FriendlyName "DailyFortune" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyExportPolicy Exportable `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          Write-Host "THUMBPRINT: $($cert.Thumbprint)"
          echo "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          Export-Certificate -Cert $cert -FilePath "${{ github.workspace }}\cert\DailyFortune.cer"

      - name: Restore
        run: dotnet restore SevenZipApp/SevenZipApp.csproj -r win-x64

      # ⬇️ 新增：编译 C++ shell 扩展
      - name: Build C++ shell extension
        shell: cmd
        run: |
          msbuild SevenZipShellExt\SevenZipShellExt.vcxproj ^
            /t:Build ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /v:minimal

      - name: Build MSIX
        shell: cmd
        run: |
          msbuild SevenZipApp\SevenZipApp.csproj ^
            /t:Rebuild ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:RuntimeIdentifier=win-x64 ^
            /p:UapAppxPackageBuildMode=SideloadOnly ^
            /p:AppxBundle=Never ^
            /p:AppxPackageSigningEnabled=true ^
            /p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }} ^
            /p:GenerateAppxPackageOnBuild=true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SevenZipApp-SignedMSIX
          path: |
            **/*.msix
            cert/DailyFortune.cer
          if-no-files-found: error