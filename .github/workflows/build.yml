name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (max errors)
        shell: pwsh
        run: |
          dotnet build `
            --no-restore `
            -c Debug `
            -p:ErrorLimit=10000 `
            -p:RunAnalyzers=false `
            -p:TreatWarningsAsErrors=false `
            -v:minimal `
            /bl:build.binlog
        continue-on-error: true

      - name: Filter errors
        if: always()
        shell: pwsh
        run: |
          Write-Host "===== 所有错误 ====="
          dotnet build `
            --no-restore `
            -c Debug `
            -p:ErrorLimit=10000 `
            -p:RunAnalyzers=false `
            -v:quiet 2>&1 |
            Select-String -Pattern "error CS" |
            ForEach-Object { $_.Line.Trim() } |
            Sort-Object -Unique

      - name: Upload binlog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-binlog
          path: build.binlog
          if-no-files-found: ignore
