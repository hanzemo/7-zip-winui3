name: Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild SevenZipApp.sln /t:Restore /p:Configuration=Debug

      - name: Build
        shell: pwsh
        run: |
          msbuild SevenZipApp.sln `
            /t:Build `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            /v:detailed `
            2>&1 | Tee-Object -FilePath build.log

      - name: Show XAML errors
        if: always()
        shell: pwsh
        run: |
          Select-String -Path build.log -Pattern "error|Error|XLS|WMC|MSB" | ForEach-Object { $_.Line }
